<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:380px;height:560px;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI","Malgun Gothic",sans-serif;background:#7a8fa6}
  .w{position:absolute;inset:0;border-radius:8px;background:rgba(243,243,243,.86);color:#1a1a1a;display:flex;flex-direction:column;padding:14px 16px;border:1px solid rgba(255,255,255,.55)}
  .hd{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#5c5c5c;margin-bottom:10px}
  .hd b{color:#1a1a1a;font-weight:600;font-size:13px}
  .big{font-size:28px;font-weight:600;line-height:1.1}
  .sub{font-size:13px;color:#5c5c5c;margin:2px 0 12px}
  .list{background:#fff;border-radius:6px;padding:4px 0;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .it{display:flex;gap:10px;padding:8px 12px;font-size:13px;align-items:center}
  .bar{width:3px;height:28px;border-radius:2px}
  .it small{display:block;color:#5c5c5c;font-size:11.5px}
  .mini{display:grid;grid-template-columns:repeat(7,1fr);font-size:11.5px;text-align:center;gap:4px 0;color:#1a1a1a}
  .mini .h{color:#5c5c5c;font-size:10.5px}
  .mini .o{color:#a0a0a0}
  .mini .t{background:#005fb8;color:#fff;border-radius:50%;width:24px;height:24px;line-height:24px;margin:0 auto}
  .sp{flex:1}
  .ft{display:flex;justify-content:space-between;font-size:12px;color:#5c5c5c;border-top:1px solid #e0e0e0;padding-top:10px}
  .ft b{color:#005fb8;font-weight:600}
</style></head><body>
<div class="w">
  <div class="hd"><b>학교 일정</b><span>···</span></div>
  <div class="big">화요일 10</div>
  <div class="sub">11월 · 오늘 일정 4개</div>
  <div class="list">
    <div class="it"><span class="bar" style="background:#999"></span><span>아침 조회<small>오전 8:20 · 교무실</small></span></div>
    <div class="it"><span class="bar" style="background:#107c10"></span><span>진로 특강<small>오후 2:40 · 강당</small></span></div>
    <div class="it"><span class="bar" style="background:#005fb8"></span><span>2학년 협의회<small>오후 3:30 · 3층 회의실</small></span></div>
    <div class="it"><span class="bar" style="background:#ca5010"></span><span>교육청 연수 출발<small>오후 4:40</small></span></div>
  </div>
  <div class="mini">
    <span class="h">일</span><span class="h">월</span><span class="h">화</span><span class="h">수</span><span class="h">목</span><span class="h">금</span><span class="h">토</span>
    <span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span>
    <span>9</span><span class="t">10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span>
    <span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span><span>22</span>
    <span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span><span>29</span>
  </div>
  <div class="sp"></div>
  <div class="ft"><span>지금 6교시 · 수학 2-5</span><b>＋ 일정</b></div>
</div>
</body></html>
