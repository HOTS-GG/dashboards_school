<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:380px;height:560px;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI","Malgun Gothic",sans-serif;background:#7a8fa6}
  .w{position:absolute;inset:0;border-radius:20px;background:#f6f1ea;color:#2a2a2a;display:flex;flex-direction:column;padding:18px 14px 14px}
  .hi{font-size:13px;color:#7a7066}
  .d{font-size:24px;font-weight:700;margin:2px 0 14px}
  .card{background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;box-shadow:0 1px 3px rgba(80,60,40,.08)}
  .tm{font-size:13px;font-weight:700;width:44px;font-variant-numeric:tabular-nums}
  .tt{font-size:14px;font-weight:600}
  .ts{font-size:12px;color:#8c8178;margin-top:2px}
  .tag{margin-left:auto;font-size:11px;padding:3px 8px;border-radius:999px;background:#f1ebe3;color:#7a7066}
  .soon{outline:2px solid #3d5afe}
  .soon .tag{background:#3d5afe;color:#fff}
  .done{opacity:.5}
  .sp{flex:1}
  .lesson{background:#fff;border-radius:16px;padding:10px 14px;font-size:12.5px;display:flex;gap:10px;margin-bottom:10px}
  .lesson b{font-weight:700}
  .btn{background:#3d5afe;color:#fff;border-radius:14px;text-align:center;padding:12px;font-weight:700;font-size:14px}
</style></head><body>
<div class="w">
  <div class="hi">안녕하세요, 김민기 선생님</div>
  <div class="d">11월 10일 화요일</div>
  <div class="card done"><span class="tm">08:20</span><span><div class="tt">아침 조회</div><div class="ts">교무실</div></span><span class="tag">학사</span></div>
  <div class="card"><span class="tm">14:40</span><span><div class="tt">진로 특강</div><div class="ts">강당 · 진행 중</div></span><span class="tag">행사</span></div>
  <div class="card soon"><span class="tm">15:30</span><span><div class="tt">2학년 협의회</div><div class="ts">3층 회의실 · 12분 후</div></span><span class="tag">회의</span></div>
  <div class="card"><span class="tm">16:40</span><span><div class="tt">교육청 연수 출발</div><div class="ts">춘천교육지원청</div></span><span class="tag">출장</span></div>
  <div class="sp"></div>
  <div class="lesson"><b>지금 6교시</b><span>수학 · 2-5</span><span style="color:#8c8178">다음 7교시 창체</span></div>
  <div class="btn">＋ 일정 추가</div>
</div>
</body></html>
